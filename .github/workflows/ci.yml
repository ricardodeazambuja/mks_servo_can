name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor: crc.py and friends use typing.Sequence rather than
        # PEP 585 builtin generics so the package imports on older interpreters,
        # and tests/unit/test_regressions.py enforces that.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The simulator depends on the library, so install the library first
          # from the local checkout rather than letting pip reach for PyPI.
          pip install -e ./mks_servo_can_library[dev]
          pip install --no-deps -e ./mks_servo_simulator
          pip install click rich fastapi uvicorn httpx pytest-cov

      - name: Run tests
        # HIL tests skip automatically without MKS_HIL_CHANNEL set.
        run: |
          pytest -v --cov=mks_servo_can_library/mks_servo_can \
                    --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - name: Lint
        run: ruff check .
      # Note: `ruff format` is deliberately not enforced yet. The codebase
      # predates any linter being run, and reformatting it wholesale would bury
      # every subsequent change under whitespace noise. The cosmetic rules are
      # listed (and explained) in the ignore block in pyproject.toml; enable
      # them together with a single formatting commit when nothing is in flight.
