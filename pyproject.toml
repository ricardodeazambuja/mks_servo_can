# Project-wide tooling configuration.
#
# The two distributions (mks-servo-can and mks-servo-simulator) keep their own
# setup.py because they are published separately; this file holds everything
# that applies across the repository.

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
# Replaces black + isort + flake8 + pylint, all four of which were configured
# here previously and none of which were enforced anywhere.
line-length = 88
target-version = "py39"
extend-exclude = ["build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # function call in default argument - common and readable here
    "UP006",   # PEP 585 generics break the Python 3.9 floor we support
    "UP007",   # ditto for X | Y unions
    "UP035",   # ditto for typing.List/Dict imports
    "B905",    # zip(strict=) is 3.10+

    # Cosmetic rules, deliberately not enforced yet. The codebase predates any
    # linter actually being run, and turning these on would mean a whole-repo
    # reformat that buries every real change under whitespace noise. Enable them
    # together with a `ruff format` pass when there is no work in flight.
    "W291",    # trailing whitespace
    "W293",    # whitespace on a blank line
    "E701",    # multiple statements on one line (colon)
    "E702",    # multiple statements on one line (semicolon)
    "RUF005",  # prefer unpacking over list concatenation
    "RUF046",  # unnecessary int() cast
    "RUF012",  # mutable class attribute needs ClassVar
    "RUF043",  # pytest.raises match= pattern is a regex
]

[tool.ruff.lint.per-file-ignores]
# Star-import of constants is the documented public surface of the package.
# __all__ there is grouped by category with explanatory comments, which is
# more useful to a reader than alphabetical order (RUF022).
"mks_servo_can_library/mks_servo_can/__init__.py" = ["F403", "F405", "F401", "RUF022"]
# Tests may shadow builtins and use asserts freely.
"tests/**" = ["B011"]
# Examples are teaching material; unused imports there are often illustrative.
# Examples are teaching material: illustrative imports, and a couple that
# deliberately manipulate sys.path before importing (E402).
"examples/**" = ["F401", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["mks_servo_can", "mks_simulator"]

[tool.coverage.run]
source = ["mks_servo_can_library/mks_servo_can"]
omit = ["*/__pycache__/*", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
