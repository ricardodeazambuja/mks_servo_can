# Packaging and tooling for the whole repository.
#
# There is one distribution, `mks-servo-can`, and the simulator is an extra of
# it: `pip install mks-servo-can[simulator]`. The two used to be separate
# distributions with a setup.py each, which bought nothing - the simulator
# hard-depends on the library, sharing its constants, CRC and motion model
# rather than reimplementing them - and cost a second version number that could
# drift away from the first.

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mks-servo-can"
dynamic = ["version"]
description = "Python library to control MKS SERVO42D/57D motors via CAN bus, with a protocol-accurate simulator."
readme = "README.md"
license = { file = "LICENSE.txt" }
authors = [{ name = "Ricardo de Azambuja" }]
# 3.9 is the floor and it is enforced: tests/unit/test_regressions.py asserts
# the package imports there, and the CI matrix runs it. The old setup.py files
# claimed 3.8, which was never tested against.
requires-python = ">=3.9"
keywords = [
    "mks", "servo", "canbus", "motor", "control", "robotics",
    "automation", "servo42d", "servo57d", "asyncio", "simulator",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Topic :: Software Development :: Testing :: Simulation",
    "Topic :: System :: Emulators",
]
dependencies = [
    "python-can>=3.0.0,<5.0.0",
]

[project.optional-dependencies]
# Everything the `mks-servo-simulator` command needs. psutil is left out
# deliberately: performance_monitor.py guards its import and degrades to fewer
# panels without it, so it belongs in `monitoring`, not here.
simulator = [
    "click>=7.0",
    "rich>=12.0.0",
    "fastapi>=0.68.0",
    "uvicorn>=0.15.0",
]
monitoring = ["psutil>=5.8.0"]
# The legacy Textual TUI (`--textual-dashboard`). Deliberately not part of
# `simulator`: the supported human surface is the browser dashboard served under
# --debug-api, and textual is a heavy dependency the rest of the simulator does
# not touch. cli.py imports it inside the --textual-dashboard branch, so its
# absence costs you that one flag and nothing else.
dashboard = ["textual>=0.40.0"]
dev = [
    "mks-servo-can[simulator,dashboard,monitoring]",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "pytest-mock>=3.0.0",
    "pytest-cov",
    # FastAPI's TestClient needs it, so tests/test_http_debug_server.py does.
    "httpx",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/ricardodeazambuja/mks_servo_can"
Source = "https://github.com/ricardodeazambuja/mks_servo_can"
"Bug Reports" = "https://github.com/ricardodeazambuja/mks_servo_can/issues"
Documentation = "https://github.com/ricardodeazambuja/mks_servo_can/tree/main/docs"

[project.scripts]
mks-servo-simulator = "mks_simulator.main:main"
mks_servo_simulator = "mks_simulator.main:main"

# The single source of the version number. `mks_simulator.__version__` re-exports
# this one rather than declaring its own.
[tool.setuptools.dynamic]
version = { attr = "mks_servo_can.__version__" }

# The two packages keep their historical directories rather than being moved
# into one src/ tree: moving them would rewrite every import path in the tests
# and examples for no packaging benefit.
[tool.setuptools]
package-dir = { mks_servo_can = "mks_servo_can_library/mks_servo_can", mks_simulator = "mks_servo_simulator/mks_simulator" }
packages = [
    "mks_servo_can",
    "mks_servo_can.data",
    "mks_servo_can.digitizer",
    "mks_servo_can.kinematics",
    "mks_simulator",
    "mks_simulator.interface",
]

[tool.setuptools.package-data]
# The manual's command transcription is read at runtime by both the simulator
# and the conformance tests, and an installed wheel has no tests/ directory to
# fall back on. Shipping without it produces a package whose command reference
# is silently empty - that was defect L7, and tests/unit/test_manual_spec_packaging.py
# guards it.
mks_servo_can = ["data/*.json"]

[tool.ruff]
# Replaces black + isort + flake8 + pylint, all four of which were configured
# here previously and none of which were enforced anywhere.
line-length = 88
target-version = "py39"
extend-exclude = ["build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # function call in default argument - common and readable here
    "UP006",   # PEP 585 generics break the Python 3.9 floor we support
    "UP007",   # ditto for X | Y unions
    "UP035",   # ditto for typing.List/Dict imports
    "B905",    # zip(strict=) is 3.10+

    # Cosmetic rules, deliberately not enforced yet. The codebase predates any
    # linter actually being run, and turning these on would mean a whole-repo
    # reformat that buries every real change under whitespace noise. Enable them
    # together with a `ruff format` pass when there is no work in flight.
    "W291",    # trailing whitespace
    "W293",    # whitespace on a blank line
    "E701",    # multiple statements on one line (colon)
    "E702",    # multiple statements on one line (semicolon)
    "RUF005",  # prefer unpacking over list concatenation
    "RUF046",  # unnecessary int() cast
    "RUF012",  # mutable class attribute needs ClassVar
    "RUF043",  # pytest.raises match= pattern is a regex
]

[tool.ruff.lint.per-file-ignores]
# Star-import of constants is the documented public surface of the package.
# __all__ there is grouped by category with explanatory comments, which is
# more useful to a reader than alphabetical order (RUF022).
"mks_servo_can_library/mks_servo_can/__init__.py" = ["F403", "F405", "F401", "RUF022"]
# Tests may shadow builtins and use asserts freely.
"tests/**" = ["B011"]
# Examples are teaching material; unused imports there are often illustrative.
# Examples are teaching material: illustrative imports, and a couple that
# deliberately manipulate sys.path before importing (E402).
"examples/**" = ["F401", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["mks_servo_can", "mks_simulator"]

[tool.coverage.run]
source = ["mks_servo_can_library/mks_servo_can"]
omit = ["*/__pycache__/*", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
